name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_DEBUG: "1"
      # Non-secret, CI-only placeholders — base.py's fail-fast guard
      # (core/tests_settings_secrets.py) requires these to be set even
      # under dev settings whenever DJANGO_DEBUG is not "1" at the point
      # they're read; setting them explicitly here also mirrors how a real
      # deployment supplies them and keeps this workflow from relying on
      # the dev auto-generated fallback.
      DJANGO_SECRET_KEY: ci-only-secret-key-never-used-in-production
      PLAY_IP_SALT: ci-only-ip-salt-never-used-in-production
      PLAY_UA_SALT: ci-only-ua-salt-never-used-in-production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # requires-python in pyproject.toml is ">=3.12,<3.15" — pin CI to the
      # floor of that range so the pipeline fails the same way a fresh
      # `pip install -e ".[dev]"` on the oldest supported interpreter would.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: python manage.py check

      - name: Run test suite with coverage
        run: |
          coverage run --source=. manage.py test
          coverage report -m

      - name: Coverage XML (for the job summary / future badge)
        if: always()
        run: coverage xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14
