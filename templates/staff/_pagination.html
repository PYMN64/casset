{% if page_obj.paginator.num_pages > 1 %}
  <nav class="pagination" aria-label="صفحه‌بندی">
    {% if page_obj.has_previous %}
      <a class="btn btn--ghost btn--sm" href="?{% if extra_qs %}{{ extra_qs }}&{% endif %}page={{ page_obj.previous_page_number }}" rel="prev">
        <svg class="icon"><use href="#i-chevron-right"/></svg>قبلی
      </a>
    {% else %}
      <span class="btn btn--ghost btn--sm" aria-disabled="true">
        <svg class="icon"><use href="#i-chevron-right"/></svg>قبلی
      </span>
    {% endif %}

    <span class="muted t-xs">
      صفحه <span class="num">{{ page_obj.number }}</span> از <span class="num">{{ page_obj.paginator.num_pages }}</span>
      · <span class="num">{{ page_obj.paginator.count }}</span> مورد
    </span>

    {% if page_obj.has_next %}
      <a class="btn btn--ghost btn--sm" href="?{% if extra_qs %}{{ extra_qs }}&{% endif %}page={{ page_obj.next_page_number }}" rel="next">
        بعدی<svg class="icon"><use href="#i-chevron-left"/></svg>
      </a>
    {% else %}
      <span class="btn btn--ghost btn--sm" aria-disabled="true">
        بعدی<svg class="icon"><use href="#i-chevron-left"/></svg>
      </span>
    {% endif %}
  </nav>
{% endif %}
