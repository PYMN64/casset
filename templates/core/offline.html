{% extends "base.html" %}
{% block title %}آفلاین | کست{% endblock %}

{% block content %}
<div class="auth">
  <div class="auth__card">
    <div class="auth__brand">
      <span class="auth__mark" aria-hidden="true"><svg class="icon"><use href="#i-play"/></svg></span>
      کست
    </div>
    <h1 class="auth__title">اتصال اینترنت نداری</h1>
    <p class="auth__sub">
      این صفحه از حافظه‌ی دستگاهت نمایش داده شد. با برگشت اینترنت، همه‌چیز
      دوباره تازه می‌شود.
    </p>

    <button class="btn btn--primary btn--block" type="button" onclick="window.location.reload()">
      تلاش دوباره
    </button>

    <div class="auth__foot">
      <a href="{% url 'library' %}">کتابخانه‌ی من</a>
    </div>
  </div>
</div>
{% endblock %}
