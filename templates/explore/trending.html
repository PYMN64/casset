{% extends "base.html" %}
{% block title %}Trending | Casset{% endblock %}
{% block content %}
<div class="card">
  <h1>Trending</h1>
  <div class="list">
    {% for t in trending_tracks %}
      <div class="row">
        <div style="min-width:0">
          <a href="/t/{{ t.slug }}/" style="font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ t.title }}</a>
          <div class="muted small">@{{ t.creator.username }} • {{ t.play_count }} plays</div>
        </div>
      </div>
    {% empty %}
      <div class="row"><span class="muted">No trending tracks.</span></div>
    {% endfor %}
  </div>
</div>
{% endblock %}
