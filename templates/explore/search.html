{% extends "base.html" %}
{% block title %}Search | Casset{% endblock %}
{% block content %}
<section class="card">
  <h1 data-i18n="search">Search</h1>
  <p class="muted small">Find tracks, creators, or genres.</p>

  <input id="searchInput" type="search" placeholder="Search..." autocomplete="off" style="width:100%" />
  <div id="searchHint" class="muted small" style="margin-top:8px">Start typing...</div>

  <div id="searchResults" class="list" style="margin-top:12px"></div>
</section>
{% endblock %}
