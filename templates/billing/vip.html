{% extends "base.html" %}
{% block title %}VIP | Casset{% endblock %}
{% block content %}
<div class="card">
  <h1>VIP</h1>
  <p class="muted small">VIP unlocks higher upload limits and downloads.</p>

  {% if profile.has_vip %}
    <div class="alert">VIP is active.</div>
  {% else %}
    <div class="muted small">VIP is not active.</div>
  {% endif %}

  <div class="row row-wrap" style="margin-top:12px">
    <a class="btn btn--ghost" href="/vip/activate-dev/">Activate DEV VIP</a>
  </div>
</div>
{% endblock %}
