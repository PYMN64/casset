<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ track.title }} — Casset</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 12px;
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      background: #17140F; color: #F2EBDC;
    }
    .embed {
      display: flex; align-items: center; gap: 12px;
      background: #1F1A13; border: 1px solid #332C21;
      border-radius: 12px; padding: 12px;
    }
    .cover {
      width: 56px; height: 56px; border-radius: 8px; flex: none;
      background: #332C21 center/cover no-repeat;
    }
    .meta { min-width: 0; flex: 1; }
    .title { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .by { font-size: 12.5px; color: #B3A791; margin-top: 2px; }
    .by a { color: inherit; }
    audio { width: 100%; margin-top: 8px; }
    a.brand {
      display: block; text-align: left; margin-top: 8px;
      font-size: 11px; color: #B3A791; text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="embed">
    {% if track.cover %}
      <div class="cover" style="background-image:url('{{ track.cover.url }}')"></div>
    {% else %}
      <div class="cover"></div>
    {% endif %}
    <div class="meta">
      <div class="title">{{ track.title }}</div>
      <div class="by">از <a href="{% url 'public_profile' username=track.creator.username %}" target="_blank" rel="noopener">@{{ track.creator.username }}</a></div>
      {% if track.audio %}
        <audio controls preload="none" style="width:100%">
          <source src="{{ track.audio.url }}" type="audio/mpeg">
        </audio>
      {% endif %}
    </div>
  </div>
  <a class="brand" href="{% url 'track_detail' slug=track.slug %}" target="_blank" rel="noopener">در Casset گوش کن ↗</a>
</body>
</html>
