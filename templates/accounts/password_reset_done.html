{% extends "base.html" %}
{% block title %}ایمیل ارسال شد | کست{% endblock %}

{% block content %}
<div class="auth">
  <div class="auth__card">
    <div class="auth__brand">
      <span class="auth__mark" aria-hidden="true"><svg class="icon"><use href="#i-lock"/></svg></span>
      کست
    </div>
    <h1 class="auth__title">ایمیل ارسال شد</h1>
    <p class="auth__sub">اگر حسابی با آن ایمیل وجود داشته باشد، لینک بازیابی برایش ارسال شده است.</p>

    <div class="notice notice--good">
      <svg class="icon"><use href="#i-mail"/></svg>
      <div>
        صندوق ورودی (و پوشه‌ی هرزنامه) را بررسی کن. لینک تا ۲۴ ساعت معتبر است.
      </div>
    </div>

    <div class="auth__foot"><a href="{% url 'login' %}">بازگشت به ورود</a></div>

  </div>
</div>
{% endblock %}
