{% extends "base.html" %}
{% block title %}Register | Casset{% endblock %}
{% block content %}
<section class="card" style="max-width:520px;margin:0 auto">
  <h1>Create account</h1>
  <p class="muted small">Use email + username or login with phone.</p>

  <form method="post" class="stack gap-2">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="row row-wrap">
      <button class="btn btn--primary" type="submit">Register</button>
      <a class="btn btn--ghost" href="/login/">Back to login</a>
    </div>
  </form>

  <hr style="margin:16px 0">
  <div class="row row-wrap">
    <a class="btn btn--ghost" href="/phone/">Login with phone (OTP)</a>
    <a class="btn btn--ghost" href="/google/">Login with Google</a>
  </div>
</section>
{% endblock %}
